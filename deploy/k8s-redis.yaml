apiVersion: apps/v1
kind: Deployment
metadata:
  name: airraid-redis
  labels:
    app: airraidanalysis
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airraidanalysis
      component: redis
  template:
    metadata:
      labels:
        app: airraidanalysis
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          args: ["--save", "", "--appendonly", "no"]
---
apiVersion: v1
kind: Service
metadata:
  name: airraid-redis
  labels:
    app: airraidanalysis
    component: redis
spec:
  selector:
    app: airraidanalysis
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
