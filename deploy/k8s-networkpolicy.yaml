apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: airraid-serve
  labels:
    app: airraidanalysis
    component: serve
spec:
  podSelector:
    matchLabels:
      app: airraidanalysis
      component: serve
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
